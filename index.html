<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>शब्दकोश — Hindi Dictionary (Garuda prototype)</title>
  <meta name="description" content="Search Hindi words in Devanagari or Roman spelling, the way you type them.">
  <meta name="theme-color" content="#7a2e12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a href="#/" class="brand" aria-label="Home">
      <span class="brand-deva" lang="hi">शब्दकोश</span>
      <span class="brand-sub">Hindi dictionary · prototype</span>
    </a>
    <span id="offline" class="pill" hidden>Offline</span>
  </header>

  <div class="search-wrap">
    <label for="q" class="visually-hidden">Search a word</label>
    <div class="search">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <!-- spellcheck/autocorrect off: phone keyboards "fix" shanti -> shanty -->
      <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" enterkeyhint="search"
             placeholder="shanti, शांति or peace">
      <button id="clear" class="icon-btn" type="button" aria-label="Clear search" hidden>×</button>
    </div>
    <p class="hint">Type the way you say it — Roman or Devanagari. English works too.</p>
  </div>

  <main id="view" aria-live="polite"></main>

  <footer class="foot">
    <span id="count"></span> words · works offline after first visit
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
